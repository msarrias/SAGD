[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sagd"
version = "0.1.0"
description = "Shape-Aware Graph Distance (SAGD) for comparing graph topologies."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
]

[project.urls]
"Homepage" = "https://github.com/msarrias/SAGD"
"Bug Tracker" = "https://github.com/msarrias/SAGD/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sagd*"]